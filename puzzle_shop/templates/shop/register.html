{% extends 'shop/base.html' %}
{% load static %}

{% block title %}Регистрация - Магазин{% endblock %}

{% block content %}

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow">
                <div class="card-header bg-success text-white">
                    <h5 class="mb-0 text-center">
                        <i class="fas fa-user-plus"></i> Создать аккаунт
                    </h5>
                </div>
                <div class="card-body">
                    <form id="register-form">
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Имя</label>
                                <input type="text" class="form-control" id="first-name">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Фамилия</label>
                                <input type="text" class="form-control" id="last-name">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Имя пользователя</label>
                            <input type="text" class="form-control" id="username" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Email</label>
                            <input type="email" class="form-control" id="email" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Пароль</label>
                            <input type="password" class="form-control" id="password" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Подтвердить пароль</label>
                            <input type="password" class="form-control" id="password-confirm" required>
                        </div>

                        <button type="submit" class="btn btn-success btn-lg w-100 mb-3">
                            <i class="fas fa-user-plus"></i> Зарегистрироваться
                        </button>
                    </form>

                    <hr>

                    <p class="text-center text-muted">
                        Уже есть аккаунт? 
                        <a href="{% url 'login' %}" class="text-decoration-none fw-bold">Войдите</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="{% static 'js/auth.js' %}"></script>
<script>
document.getElementById('register-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const username = document.getElementById('username').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const passwordConfirm = document.getElementById('password-confirm').value;
    const firstName = document.getElementById('first-name').value;
    const lastName = document.getElementById('last-name').value;
    
    const success = await register(username, email, password, passwordConfirm, firstName, lastName);
    
    if (success) {
        setTimeout(() => window.location.href = '/login/', 1500);
    }
});
</script>

{% endblock %}
