{% extends 'shop/base.html' %}
{% load static %}

{% block title %}Вход - Магазин{% endblock %}

{% block content %}

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card border-0 shadow">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0 text-center">
                        <i class="fas fa-sign-in-alt"></i> Вход в аккаунт
                    </h5>
                </div>
                <div class="card-body">
                    <form id="login-form">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Имя пользователя</label>
                            <input type="text" class="form-control" id="username" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Пароль</label>
                            <input type="password" class="form-control" id="password" required>
                        </div>

                        <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">
                            <i class="fas fa-sign-in-alt"></i> Войти
                        </button>
                    </form>

                    <hr>

                    <p class="text-center text-muted">
                        Нет аккаунта? 
                        <a href="{% url 'register' %}" class="text-decoration-none fw-bold">Зарегистрируйтесь</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="{% static 'js/auth.js' %}"></script>
<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    
    await login(username, password);
});
</script>

{% endblock %}
